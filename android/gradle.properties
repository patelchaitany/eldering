# Run Gradle on JDK 21: export JAVA_HOME=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official

# AndroidX (also the AGP 9 default; stated explicitly for older tooling and IDE sync).
android.useAndroidX=true
# Other AGP 9 defaults we rely on (do not override): android.newDsl=true, android.builtInKotlin=true,
# android.nonTransitiveRClass=true, buildConfig off unless enabled per module, unit tests for debug only.
