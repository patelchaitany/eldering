# /etc/nginx/sites-available/eldering  (symlinked into sites-enabled)
# Pre-certbot version: HTTP only. deploy.sh replaces __ELDERING_DOMAIN__; `sudo certbot --nginx -d <domain> --redirect`
# then rewrites THIS file only (adds `listen 443 ssl` + cert lines and an :80 redirect block).
# Do not add `http2` (nginx < 1.25.1 would enable it for every vhost on :443).
#
# http{}-context directives are legal here: Ubuntu's nginx.conf includes sites-enabled/*
# inside http{}. Zone/map/log_format names are global, hence the eldering_ prefix.

map $request_uri $eldering_log_uri {      # keep share tokens out of access logs
    ~^/s/   "/s/[redacted]";
    default $request_uri;
}
log_format eldering_privacy '$remote_addr - [$time_local] "$request_method $eldering_log_uri $server_protocol" '
                            '$status $body_bytes_sent $request_time "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=eldering_auth:1m rate=10r/m;   # coarse guard; the Go limiter is primary

upstream eldering_api {
    server 127.0.0.1:8095;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ELDERING_DOMAIN__;
    server_tokens off;

    access_log /var/log/nginx/eldering.access.log eldering_privacy;
    error_log  /var/log/nginx/eldering.error.log warn;

    client_max_body_size 1m;
    client_body_timeout 15s;

    # Server level only: an add_header inside a location would drop all of these there.
    add_header Strict-Transport-Security "max-age=31536000" always;   # no includeSubDomains (shared parent domain)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Errors nginx produces itself keep the API's JSON envelope (SPEC: {error:{code,message}}).
    error_page 413 = @eldering_413;
    error_page 429 = @eldering_429;
    location @eldering_413 {
        default_type application/json;
        return 413 '{"error":{"code":"body_too_large","message":"request body exceeds 1048576 bytes"}}\n';
    }
    location @eldering_429 {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"too many requests, retry later"}}\n';
    }

    # Only the password endpoints: token refresh/logout keep the API's own, more generous
    # per-IP limit (many phones share one carrier-NAT address and refresh every 15 min).
    location ~ ^/v1/auth/(login|register)$ {
        limit_req zone=eldering_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://eldering_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;        # OVERWRITE: the API trusts this header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://eldering_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
