# Eldering stack: PostGIS + one-shot migrate + API.
# Production (small shared VM, ~1 GB RAM): copied to ~/eldering-safety/docker-compose.yml.
#  - API published on 127.0.0.1:8095 ONLY (nginx terminates TLS in front of it).
#  - Postgres is not published at all (internal network, no egress).
#  - Secrets come from .env (chmod 600, generated on the server, never printed).
name: eldering

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgis/postgis:16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: eldering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    # Tuned for a 256 MiB container on a 1 GB host (see docs/research/server-stack.md §8).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - jit=off
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=2
      - -c
      - huge_pages=off
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eldering -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    logging: *logging

  # Idempotent on every deploy: creates/updates roles + grants as superuser,
  # then applies embedded migrations as eldering_owner.
  migrate:
    image: eldering-api:${API_TAG:-dev}
    build:
      context: .
      platforms: [linux/amd64]
    platform: linux/amd64
    command: ["migrate"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/eldering?sslmode=disable
      DATABASE_OWNER_URL: postgres://eldering_owner:${ELDERING_OWNER_PASSWORD:?}@db:5432/eldering?sslmode=disable
      ELDERING_OWNER_PASSWORD: ${ELDERING_OWNER_PASSWORD:?}
      ELDERING_APP_PASSWORD: ${ELDERING_APP_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  api:
    image: eldering-api:${API_TAG:-dev}
    platform: linux/amd64
    command: ["serve"]
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://eldering_app:${ELDERING_APP_PASSWORD:?}@db:5432/eldering?sslmode=disable&pool_max_conns=8
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (hex, 32+ bytes) in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://safety.example.com}
      CLIENT_IP_HEADER: X-Real-IP # nginx overwrites it; the port is loopback-only
      # Soft GC target under the 128m hard limit. It covers only Go-managed memory, so it leaves
      # room for the ~13 MiB binary and Go 1.26's 32 MiB crypto/internal/fips140/drbg scratch
      # buffer (.noptrbss; resident on THP=always hosts such as Docker Desktop). 100MiB let a
      # burst of sign-ups OOM-kill the API (e2e TestAvailability); see internal/auth/password.go.
      GOMEMLIMIT: 80MiB
      TZ: UTC
    ports:
      - "127.0.0.1:8095:8080"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # backend: internal (db). edge: required, a port published from an
    # internal-only network is unreachable.
    networks: [backend, edge]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/eldering-api", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    logging: *logging

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata: {}
